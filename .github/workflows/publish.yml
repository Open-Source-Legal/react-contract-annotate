name: Stage on npm

# Stages the version in package.json on npm when a GitHub release is published.
# A staged version is not installable: a maintainer approves it on npmjs.com
# (Staged Packages) or with `npm stage approve`, which asks for their second
# factor. Nothing in this repository can publish without that approval: the
# workflow holds no npm token, and the package's trusted publisher on npm
# allows `npm stage publish` only.
on:
  release:
    types: [published]

permissions:
  contents: read
  # For npm trusted publishing and the provenance attestation.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # setup-node writes a placeholder token, which npm would send instead of
      # authenticating as the trusted publisher.
      - name: Authenticate as the trusted publisher only
        run: sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"

      - name: Check the release tag is the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Lint imports
        run: yarn lint:imports

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

      - name: Build
        run: yarn build

      - name: Check dist
        run: yarn check:dist

      # Staged publishing needs npm 11.15 or later.
      - name: Stage
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@os-legal/react-contract-annotate@$VERSION" version 2>/dev/null; then
            echo "v$VERSION is already published, skipping"
          else
            npm --version
            npm stage publish --access public --provenance
            echo "::notice::v$VERSION is staged. Approve it on npmjs.com (Staged Packages) to publish it."
          fi
